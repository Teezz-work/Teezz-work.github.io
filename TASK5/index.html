<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости вашего заказа</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Калькулятор стоимости вашего заказа</h1>

        <form id="order-form">
            <p>
                <label for="quantity">Кол-во товара:</label><br>
                <input type="text" id="quantity" name="quantity">
            </p>

            <p>
                <label for="product">Выберите товар:</label><br>
                <select id="product" name="product">
                    <option value="500">Футболка Оверсайз  490 руб</option>
                    <option value="1000">Кроссовки Хайп  990 руб</option>
                    <option value="1500">Чёрный Рюкзак   1490 руб</option>
                </select>
            </p>

            <button type="button" id="calculate">Узнать стоимость :)</button>

            <p id="result"></p>
        </form>
    </main>
</body>
</html>
